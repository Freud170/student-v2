info:
  name: PLZ 76133 und Nachname
  type: http
  seq: 5

http:
  method: GET
  url: "{{restUrl}}?plz=76133&nachname=muster"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body
      operator: length
      value: "1"
    - expression: res.body[0].id
      operator: eq
      value: "1"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
