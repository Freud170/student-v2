info:
  name: Nicht-vorhandener Nachname
  type: http
  seq: 6

http:
  method: GET
  url: "{{restUrl}}?nachname=xyz"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "404"
    - expression: res.body.msg
      operator: eq
      value: Nicht gefunden

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
