info:
  name: Leere Leistungsliste lesen
  type: http
  seq: 18

http:
  method: GET
  url: "{{putUrl}}"
  headers:
    - name: Accept
      value: "application/json"
    - name: Accept-Encoding
      value: "identity"

runtime:
  scripts:
    - type: tests
      code: |-
        test('Vollstaendige fachliche Daten und Version', () => {
            expect(res.getBody()).to.include({
                matrikelnummer: '777779', nachname: 'Neu',
                vorname: 'Tina', email: 'put.bruno@h-ka.de', username: 'put-bruno', version: 2
            });
            expect(res.getBody().adresse).to.deep.equal({"plz":"53113","ort":"Bonn"});
            expect(res.getBody().pruefungsleistungen).to.deep.equal([]);
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers.etag
      operator: matches
      value: '^"2"$'

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
