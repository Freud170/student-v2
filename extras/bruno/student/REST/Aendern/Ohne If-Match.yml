runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "428"
    - expression: res.headers['content-type']
      operator: eq
      value: "application/problem+json"
    - expression: res.body.statusCode
      operator: eq
      value: "428"
    - expression: res.headers['cache-control']
      operator: eq
      value: "no-store"

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
