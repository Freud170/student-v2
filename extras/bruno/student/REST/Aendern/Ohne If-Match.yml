    type: bearer
    token: "{{adminToken}}"
  body:
    type: json
    data: |-
      {
          "matrikelnummer": "777779",
          "nachname": "Neu",
          "vorname": "Falsch",
          "email": "put.bruno@h-ka.de",
          "username": "put-bruno",
          "adresse": {
              "plz": "53113",
              "ort": "Bonn"
          },
          "pruefungsleistungen": [
              {
                  "modul": "Netze",
                  "note": 1,
                  "semester": "WS 2026/27"
              }
          ]
