info:
  name: Nach Fehlern unveraendert
  type: http
  seq: 16

http:
  method: GET
  url: "{{putUrl}}"
  headers:
    - name: Accept
      value: "application/json"
    - name: Accept-Encoding
      value: "identity"

runtime:
  scripts:
    - type: tests
      code: |-
        test('Fehler haben weder Daten noch Version oder Zeitstempel veraendert', () => {
            expect(res.getBody()).to.deep.equal(JSON.parse(bru.getVar('putSnapshot')));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers.etag
      operator: matches
      value: '^"1"$'

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
