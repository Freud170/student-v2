info:
  name: Mit ungueltigen Daten
  type: http
  seq: 8

http:
  method: PUT
  url: "{{putUrl}}"
  headers:
    - name: Content-Type
      value: "application/json"
    - name: If-Match
      value: "{{putEtag}}"
  auth:
    type: bearer
    token: "{{adminToken}}"
  body:
    type: json
    data: |-
      {
          "matrikelnummer": "777779",
          "nachname": "Neu",
          "vorname": "Falsch",
          "email": "put.bruno@h-ka.de",
          "username": "put-bruno",
          "adresse": {
              "plz": "1234",
              "ort": "Bonn"
          },
          "pruefungsleistungen": [
              {
                  "modul": "Netze",
                  "note": 1,
                  "semester": "WS 2026/27"
              }
          ]
      }

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "422"
    - expression: res.headers['content-type']
      operator: eq
      value: "application/problem+json"
    - expression: res.body.statusCode
      operator: eq
      value: "422"

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
