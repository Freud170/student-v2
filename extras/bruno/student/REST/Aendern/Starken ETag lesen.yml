info:
  name: Starken ETag lesen
  type: http
  seq: 2

http:
  method: GET
  url: "{{putUrl}}"
  headers:
    - name: Accept
      value: "application/json"
    - name: Accept-Encoding
      value: "identity"

runtime:
  scripts:
    - type: tests
      code: |-
        test('Vollstaendige fachliche Daten und Version', () => {
            expect(res.getBody()).to.include({
                matrikelnummer: '777779', nachname: 'Neu',
                vorname: 'Nina', email: 'put.bruno@h-ka.de', username: 'put-bruno', version: 0
            });
            expect(res.getBody().adresse).to.deep.equal({"plz":"53111","ort":"Bonn"});
            expect(res.getBody().pruefungsleistungen).to.deep.equal([{"modul":"Datenbanken","note":2,"semester":"SS 2026"}]);
        });
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            bru.setVar('putEtag', res.getHeader('etag'));
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.headers.etag
      operator: matches
      value: '^"0"$'

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
