info:
  name: Neuer Student kein JSON
  type: http
  seq: 5

http:
  method: POST
  url: "{{restUrl}}"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: text
    data: |-
      FALSCHES JSON
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
    - expression: res.headers['content-type']
      operator: eq
      value: application/problem+json
    - expression: res.body.title
      operator: eq
      value: Bad Request

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
