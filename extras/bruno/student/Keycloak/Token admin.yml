info:
  name: Token admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{issuer}}/protocol/openid-connect/token"
  body:
    type: form-urlencoded
    data:
      - name: grant_type
        value: password
      - name: username
        value: "{{process.env.TEST_ADMIN_USERNAME}}"
      - name: password
        value: "{{process.env.TEST_ADMIN_PASSWORD}}"
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{process.env.CLIENT_SECRET}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar('adminToken', '');
        bru.setVar('adminRefreshToken', '');
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            bru.setVar('adminToken', res.getBody().access_token);
            bru.setVar('adminRefreshToken', res.getBody().refresh_token);
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.access_token
      operator: matches
      value: ^[^.]+\.[^.]+\.[^.]+$
    - expression: res.body.refresh_token
      operator: isNotEmpty

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
