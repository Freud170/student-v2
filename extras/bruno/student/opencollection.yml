opencollection: 1.0.0

info:
  name: student-v2
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: https://localhost:3000
    - name: issuer
      value: https://localhost:8843/realms/student
    - name: clientId
      value: student-client
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
