info:
  name: DB neu laden
  type: http
  seq: 1

http:
  method: QUERY
  url: "{{baseUrl}}/dev/db_populate"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 200) {
            bru.setVar('putUrl', '');
            bru.setVar('putEtag', '');
            bru.setVar('putSnapshot', '');
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "200"

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
