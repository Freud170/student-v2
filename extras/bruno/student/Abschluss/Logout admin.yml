info:
  name: Logout admin
  type: http
  seq: 2

http:
  method: POST
  url: "{{issuer}}/protocol/openid-connect/logout"
  body:
    type: form-urlencoded
    data:
      - name: client_id
        value: "{{clientId}}"
      - name: client_secret
        value: "{{process.env.CLIENT_SECRET}}"
      - name: refresh_token
        value: "{{adminRefreshToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 204) {
            bru.setVar('adminToken', '');
            bru.setVar('adminRefreshToken', '');
        }
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
