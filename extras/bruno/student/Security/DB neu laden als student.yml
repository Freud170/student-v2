info:
  name: DB neu laden als student
  type: http
  seq: 3

http:
  method: QUERY
  url: "{{baseUrl}}/dev/db_populate"
  auth:
    type: bearer
    token: "{{studentToken}}"

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "403"

settings:
  encodeUrl: true
  timeout: 5000
  followRedirects: false
