# Konfiguration fuer den App-Container; Dateien werden read-only eingebunden.

[server]
port = 3000
keyFile = "/run/secrets/student-key.pem"
certFile = "/run/config/student-certificate.crt"
allowHTTP1 = true

[log]
level = "info"
output = "console"
pretty = false

[cors]
origins = ["https://localhost:4200", "https://localhost:5173"]

[db]
# PostgreSQL muss im Container-Netzwerk unter diesem Namen erreichbar sein.
host = "postgres"
port = 5432
database = "student"
user = "student"
passwordFile = "/run/secrets/student-db-password"
caFile = "/run/config/postgres-ca.crt"
poolMax = 5
poolIdleTimeoutMillis = 30000
poolConnectionTimeoutMillis = 5000
queryTimeoutMillis = 5000
# Kein Dev-Endpunkt zum Neuladen; kein Superuser-Passwort erforderlich.
populate = false

[keycloak]
# Auch im Container den Issuer der lokal bezogenen Tokens erwarten.
issuer = "https://localhost:8843/realms/student"
# Nur der Schluesselabruf verwendet die Adresse im Docker-Netz.
jwksUri = "https://keycloak:8443/realms/student/protocol/openid-connect/certs"
clientId = "student-client"
audience = ["account"]
# Vorhandener Mount; App und Keycloak verwenden dasselbe Zertifikat.
caFile = "/run/config/student-certificate.crt"
