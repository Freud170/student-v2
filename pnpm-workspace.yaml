# https://pnpm.io/settings

# Abbruch, wenn die pnpm-Version nicht zu "packageManager" in package.json passt
# https://pnpm.io/settings/cli#pmonfail
pmOnFail: error

# Exakte Versionen in package.json eintragen, z.B. "5.0.0-rc.0" statt "^5.0.0-rc.0"
# https://pnpm.io/cli/add#--save-exact--e
saveExact: true
savePrefix: ""

# Vite/Vitest benoetigen den nativen esbuild-Build.
allowBuilds:
  esbuild: true

# https://pnpm.io/settings/other#dedupedirectdeps
dedupeDirectDeps: true

# Keine Dependencies von Git-Repositories oder direkten URLs zu TARs
# https://pnpm.io/settings/dependency-resolution#blockexoticsubdeps
blockExoticSubdeps: true

# Ausnahme von der Mindest-Wartezeit fuer neue Releases (Default: 1 Tag)
# https://pnpm.io/settings/dependency-resolution#minimumreleaseage
minimumReleaseAgeExclude: ["hono@5.0.0-rc.0"]

# GHSA-g3hv-75wg-m249: auf die geprueften ESLint-Abhaengigkeiten begrenzt.
# Nach einem Update dieser Elternpakete erneut pruefen und moeglichst entfernen.
overrides:
  "eslint@10.14.0>minimatch": "11.0.1"
  "@eslint/config-array@0.23.5>minimatch": "11.0.1"

lockfile:
  format: v13
