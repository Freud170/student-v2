# Konfiguration des Appservers. Auskommentierte Werte = Default aus config.mts

[server]
#port = 3000
# Pfade relativ zum Projektverzeichnis, Default: src/config/tls/...
#keyFile = "src/config/tls/key.pem"
#certFile = "src/config/tls/certificate.crt"
# Bruno kann nur HTTP 1.1
allowHTTP1 = true

[log]
level = "info"
# console: Standardausgabe, file: JSON-Datei, both: beides
output = "both"
dir = "log"
file = "server.log"
# Nur die Konsolenausgabe formatieren; Logdateien bleiben JSON.
pretty = true

[cors]
# Exakte Origins ohne abschliessenden Slash. Keine pauschale Browserfreigabe.
origins = ["https://localhost:4200", "https://localhost:5173"]

[db]
host = "localhost"
port = 5432
database = "student"
user = "student"
# Pfade relativ zum Projektverzeichnis. Inhalte werden nicht protokolliert.
passwordFile = "extras/compose/postgres/password.txt"
caFile = "extras/compose/postgres/init/tls/server.crt"
poolMax = 5
poolIdleTimeoutMillis = 30000
poolConnectionTimeoutMillis = 5000
queryTimeoutMillis = 5000
# Nur in der Entwicklung: DB per QUERY /dev/db_populate neu laden (Tabellen neu
# anlegen und CSV-Testdaten importieren). COPY erfordert den Superuser.
populate = true
admin = "postgres"
adminPasswordFile = "extras/compose/postgres/password.txt"

[keycloak]
# Tokens ueber den lokalen HTTPS-Endpunkt beziehen; Issuer exakt pruefen.
issuer = "https://localhost:8843/realms/student"
jwksUri = "https://localhost:8843/realms/student/protocol/openid-connect/certs"
clientId = "student-client"
audience = ["account"]
# Das vorhandene Zertifikat ist auch der Vertrauensanker fuer Keycloak.
caFile = "src/config/tls/certificate.crt"
