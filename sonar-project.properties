# Konfiguration fuer den SonarQube-Scanner (Aufruf: pnpm run sonar)
# Der Token kommt NICHT hierher, sondern aus der Umgebungsvariable SONAR_TOKEN.

sonar.projectKey=student-v2
sonar.projectVersion=2026.11.0
sonar.scm.disabled=true
sonar.sources=src
sonar.typescript.tsconfigPaths=./tsconfig.json
sonar.javascript.environments=node
sonar.host.url=http://localhost:9000
sonar.exclusions=\
node_modules/**,\
.scannerwork/**,\
.vscode/**,\
coverage/**,\
dist/**,\
extras/**,\
log/**
