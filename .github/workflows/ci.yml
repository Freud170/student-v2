# CI mit GitHub Actions: Formatierung, Linting, Typpruefung und Unit-Tests bei jedem Push
# und Pull Request. Integrationstests brauchen App und PostgreSQL und laufen nur lokal
# (pnpm run test:integration).

name: CI

on:
  push:
  pull_request:

# Der Workflow darf das Repository nur lesen
permissions:
  contents: read

jobs:
  checks:
    name: Code quality and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Actions per Commit-SHA einbinden: ein Tag wie v7 kann spaeter auf anderen Code zeigen
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm vor Node installieren, damit setup-node den pnpm-Cache nutzen kann
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.19.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm

      # Bricht ab, wenn pnpm-lock.yaml nicht zu package.json passt
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting (Oxfmt)
        run: pnpm run fmt:check

      - name: Lint (Oxlint)
        run: pnpm run lint

      - name: Check types (tsc)
        run: pnpm run typecheck

      - name: Run unit tests (Vitest)
        run: pnpm run test:run
